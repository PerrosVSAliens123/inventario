{% extends "base.html" %}
{% block contenido %}
<div class="tarjeta" style="max-width:420px;margin:40px auto">
  <h2 style="margin-top:0;color:#c2410c">Iniciar sesión</h2>
  <p style="color:#6b7280">Elige tu perfil e ingresa la contraseña.</p>
  <form method="post">
    <div class="campo">
      <label for="rol">Perfil</label>
      <select id="rol" name="rol" required>
        <option value="admin">Administrador</option>
        <option value="lector">Solo lectura</option>
      </select>
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
    </div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
